name: Run Rust tests
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'rust/**'
  # Want to trigger these tests whenever the attestation
  # libraries are regenerated, or new modules/tests are
  # added to the language bindings
  pull_request:
      paths:
          - 'rust/**'
permissions: read-all
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1 # v7.0.1
      - name: Install protoc dependency
        uses: arduino/setup-protoc@v3.0.0 # v3.0.0
        with:
          version: '24.x'
      - name: Build
        run: |
          cd rust && cargo build
      - name: Format
        run: |
          cd rust && cargo fmt --check
      - name: Lint
        run: |
          cd rust && cargo clippy -- -Dwarnings
      - name: Run tests
        run: |
          cd rust && cargo test
