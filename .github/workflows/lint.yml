name: Lint
on: [workflow_dispatch, pull_request]
permissions: read-all
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
    - name: Setup Node
      uses: actions/setup-node@v7.1.0
    - run: npm ci --ignore-scripts
    - run: npm run lint --silent
